# Parametri di EnergyLessPolicy (workflow offloading policy "energyless").
#
# Il file viene letto all'avvio del nodo se nel file di configurazione
# principale è presente:
#   workflow.offloading.policy: energyless
#   workflow.offloading.policy.energyless.config.path: examples/energyless/energyless-config.yaml
#
# Tutte le chiavi sono facoltative: una chiave assente usa il valore della
# corrispondente chiave "workflow.offloading.policy.energyless.*" del file
# principale (se presente) o il default indicato qui sotto. Una chiave
# sconosciuta (refuso) fa ignorare l'intero file, con un messaggio nel log.

# Pesi dell'obiettivo (Eq. 22 del paper). Contano solo i valori relativi
# (l'obiettivo è normalizzato per task). Valori >= 0.
weight.time: 0
weight.energy: 1.0
weight.carbon: 0
weight.cost: 0


# Quante volte il piano calcolato per una richiesta può essere riletto dalla
# cache prima di scadere. 9999 = praticamente "piano unico per richiesta"
# (come HEFTless); 1 = ricalcolo a quasi ogni round (come ILP). Valore > 0.
placement.ttl: 9999

# Soglia minima di accuratezza complessiva del workflow, usata quando la
# richiesta non specifica RequestQoS.MinAccuracy (--min-accuracy da CLI).
# La soglia della richiesta ha sempre la precedenza. Valore in (0, 1].
default.min.accuracy: 0.8

# Tempi di ripiego, in secondi, usati SOLO quando per una coppia (nodo,
# funzione) non esiste ancora una misura in Prometheus. Il modo corretto di
# evitarli è il tuning preliminare (scripts/tune-energyless.sh); in
# alternativa conviene metterli vicini alla durata reale delle funzioni del
# workload. Default 0.01 se assenti. Valori > 0.
default.exec.time: 4.0
default.init.time: 0.5

# File con le misure del tuning (scritto da scripts/tune-energyless.sh): usato
# quando manca la metrica live in Prometheus (es. dopo un riavvio di
# Prometheus o del nodo), prima dei default qui sopra. Percorso relativo alla
# cartella da cui si avvia il nodo.
tuning.file: "examples/energyless/tuning-energyless.yaml"

# Numero di core di un nodo cloud. L'energia di esecuzione di una funzione è
# potenza di UN core x tempo (ogni funzione usa 1 core), con potenza di un
# core = consumption.processing.power / numero di core del nodo. Per i nodi
# edge il numero di core è pool.cpus (locale) o TotalCPU dell'heartbeat
# (vicini); il cloud non lo comunica, quindi si indica qui. Default 1
# (potenza del nodo intera per funzione). Valore > 0.
cloud.cores: 1

# Costo di trasferimento dei dati (Eq. 14), per byte e per tratta. I dati
# passano direttamente tra nodi (nella richiesta HTTP di offloading e nella
# sua risposta): cloud2datastore.transfer.cost vale per le tratte che toccano
# il cloud, node2datastore.transfer.cost per quelle tra nodi edge. Default 0.0.
# I costi di storage (Eq. 15) sono ancora accettati ma ignorati: non c'è più un
# data store. Banda delle tratte: chiavi del file principale
# workflow.offloading.policy.edge_to_edge_bandwidth (tra nodi edge, default
# 100 Mbps) e workflow.offloading.policy.node2datastore.bandwidth (tra un nodo
# edge e il cloud, default 40 Mbps), come nella RemoteOffloadingPolicy.
node2datastore.transfer.cost: 0.0
cloud2datastore.transfer.cost: 0.0